
name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: ["principal"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Descomprimir proyecto
        run: unzip MiControlDeNegociosAndroid.zip -d proyecto

      - name: Compilar APK
        working-directory: proyecto/MiControlDeNegociosAndroid
        run: gradle assembleDebug

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Control-de-Negocios-APK
          path: proyecto/MiControlDeNegociosAndroid/app/build/outputs/apk/debug/app-debug.apk
